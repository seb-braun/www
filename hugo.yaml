# If your site is in 'https', then make sure your base url isn't written using 'http' otherwise your sitemap would
# contain http (as opposeed to https) URLs. This would affect Google indexing of your URLs.
baseURL: "http://w.yet.org/"
title: Yet Emerging Technologies
copyright: "none"
#paginate: 5
pagination:
  pagerSize: 8
theme: PaperMod
defaultContentLanguage: en
contentDir:  content

enableInlineShortcodes: true
enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false
enableEmoji: true
pygmentsUseClasses: true
mainsections: ["posts", "papermod"]

minify:
  disableXML: true
  # minifyOutput: true

languages:
  en:
    languageName: "English"
    weight: 1
    taxonomies:
      category: categories
      tag: tags
      series: series
    menu:
      main:
        - name: archive
          url: archives
          weight: 5
        - name: search
          url: search/
          weight: 10
        - name: tags
          url: tags/
          weight: 10
        - name: yet sf
          url: http://wiki.yet.org

outputs:
  home:
    - HTML
    - RSS
    - JSON

params:
  env: production # to enable google analytics, opengraph, twitter-cards and schema.
  description: "Yet Emerging Technologies - Blog"
  author: planetrobbie
  # author: ["Me", "You"] # multiple authors

  defaultTheme: auto
  # disableThemeToggle: true
  ShowShareButtons: true
  ShareButtons: ["linkedin", "reddit", "ycombinator"]
  ShowReadingTime: true
  # disableSpecial1stPost: true
  displayFullLangName: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowRssButtonInSectionTermList: true
  ShowAllPagesInArchive: true
  ShowPageNums: true
  ShowToc: true
  # comments: false
  images: ["images/y-steal.png"]

  profileMode:
    enabled: false
    title: PaperMod
    imageUrl: "#"
    imageTitle: my image
    # imageWidth: 120
    # imageHeight: 120
    buttons:
      - name: Archives
        url: archives
      - name: Tags
        url: tags

  socialIcons:
    - name: github
      title: View Source on Github
      url: "https://github.com/planetrobbie/www/blob/main/"
    - name: linkedin
      title: linkedin
      url: "https://www.linkedin.com/in/planetrobbie"

  homeInfoParams:
    Title: "about <font color='#1F51FF'>yet</font>"
    Content: >
      I’m Sébastien Braun. I currently lead a team of solutions engineers at GitHub, a San Francisco–based company that powers the modern software lifecycle—from planning and coding to testing, deployment, operations, and security. With AI woven into every stage, GitHub helps teams build, ship, and maintain software faster and more safely so organizations can focus on their core business. Our mission is to help customers win in today’s fast-moving economy, where speed, quality, and intelligent automation across the entire software lifecycle are non-negotiable.

      This site is my personal corner of the web—a place where I collect things, mostly around Open Source and innovation, as a reminder of where we’ve been and where we’re going. It’s not just about “things,” though: you’ll find how-tos, experiments, and excuses to play with the endless array of tools out there. Because if we can’t find a good reason to tinker, we’ll just make one.

      Apart from *[PaperMod](https://github.com/adityatelange/hugo-PaperMod)* Hugo theme inspired by *[Paper](https://github.com/nanxiaobei/hugo-paper)* yet is also powered by

      <div class="row">
        <div class="column">
          {{< figure src="/images/archlinux.svg" link="https://archlinux.org">}}
        </div>
        <div class="column">
          {{< figure src="/images/incus.svg" link="https://linuxcontainers.org/incus/">}}
        </div>
        <div class="column">
          {{< figure src="/images/hugo.svg" link="https://gohugo.io/">}}
        </div>
      </div>

      Source code is hosted on GitHub, you can reach out to me on LinkedIn.
  socialIcons:
    - name: github
      title: View Source on Github
      url: "https://github.com/planetrobbie/www/"
    - name: linkedin
      title: linkedin
      url: "https://www.linkedin.com/in/planetrobbie"

  editPost:
    URL: "https://github.com/planetrobbie/www/blob/main/content"
    Text: "Suggest Changes" # edit text
    appendFilePath: true # to append file path to Edit link

  label:
